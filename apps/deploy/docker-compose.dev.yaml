version: '3.8'

services:
  postgres:
    image: postgres:15
    restart: unless-stopped
    environment:
      POSTGRES_USER: devuser
      POSTGRES_PASSWORD: devpass
      POSTGRES_DB: chatdb
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
  
  migration:
    image: flyway/flyway:10.15-alpine
    volumes:
      - ./migrations:/flyway/sql
    command: >
      -connectRetries=10
      -url=jdbc:postgresql://postgres:5432/chatdb
      -user=devuser
      -password=devpass
      migrate
    depends_on:
      - postgres

  mongo:
    image: mongo:6
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongodata:/data/db
  
  openobserve:
    image: public.ecr.aws/zinclabs/openobserve:latest
    restart: unless-stopped
    environment:
      ZO_ROOT_USER_EMAIL: "root@example.com"
      ZO_ROOT_USER_PASSWORD: "Complexpass#123"
    ports:
      - "5080:5080"
    volumes:
      - openobserve-data:/data

volumes:
  pgdata:
  mongodata:
  openobserve-data: