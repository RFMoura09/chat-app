version: '3.8'

services:
  postgres:
    image: postgres:15
    restart: unless-stopped
    environment:
      POSTGRES_USER: devuser
      POSTGRES_PASSWORD: devpass
      POSTGRES_DB: chatdb
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
  
  migration:
    image: flyway/flyway:10.15-alpine
    volumes:
      - ./migrations:/flyway/sql
    command: >
      -connectRetries=10
      -url=jdbc:postgresql://postgres:5432/chatdb
      -user=devuser
      -password=devpass
      migrate
    depends_on:
      - postgres

  mongo:
    image: mongo:6
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongodata:/data/db
  
  signoz:
    image: signoz/signoz:latest
    ports:
      - "3301:3301"   # backend API port
      - "3302:3302"   # UI port
    environment:
      - POD_NAMESPACE=default
      - COLLECTION_TYPE=standalone
    restart: unless-stopped

volumes:
  pgdata:
  mongodata: